apiVersion: v1
kind: Service
metadata:
  name: genebridge-service
  namespace: genebridge-mlops
  labels:
    app: genebridge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
    prometheus.io/path: "/metrics"
spec:
  type: LoadBalancer
  selector:
    app: genebridge
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000

